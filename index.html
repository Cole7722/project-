<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171714" />
    <title>Find That Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Find That Book home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span></span>
        <span>Find That</span>
        <strong>Book</strong>
      </a>
    </header>

    <main>
      <section class="hero" id="catalogue">
        <p class="eyebrow">Discover a favourite</p>
        <h1>Find that book.</h1>

        <div class="search-wrap">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
          <label class="sr-only" for="searchInput">Search by title or author</label>
          <input id="searchInput" type="search" placeholder="Search by title or author..." autocomplete="off" />
          <span id="resultCount" aria-live="polite">0 books</span>
        </div>
      </section>

      <section class="catalogue" aria-labelledby="catalogueTitle">
        <div class="toolbar">
          <h2 id="catalogueTitle">Popular picks</h2>
          <div class="filter-bar" aria-label="Catalogue filters">
            <label>
              <span>Genre</span>
              <select id="genreFilter"><option value="all">All genres</option></select>
            </label>
            <label>
              <span>Collection</span>
              <select id="collectionFilter">
                <option value="all">All books</option>
                <option value="popular">Popular picks</option>
                <option value="hidden">Hidden gems</option>
                <option value="classic">Modern classics</option>
                <option value="recent">Recent reads</option>
                <option value="rated">Highly rated</option>
              </select>
            </label>
          </div>
        </div>
        <p id="catalogueStatus" class="catalogue-status" aria-live="polite">Loading collection…</p>
        <div id="bookGrid" class="book-grid"></div>
        <button id="loadMore" class="load-more" type="button" hidden>Load more books</button>
        <div id="emptyState" class="empty-state" hidden>
          <h3>No books found</h3>
          <p>Try another title or author.</p>
        </div>
      </section>
    </main>

    <div id="bookModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-backdrop" type="button" aria-label="Close book details"></button>
      <article class="modal-panel">
        <button class="modal-close" type="button" aria-label="Close">×</button>
        <div class="modal-visual">
          <img id="modalCover" class="modal-cover" alt="" />
        </div>
        <div class="modal-content">
          <p id="modalMeta" class="modal-meta"></p>
          <h2 id="modalTitle"></h2>
          <p id="modalAuthor" class="modal-author"></p>
          <p id="modalDescription" class="modal-description"></p>
          <div class="rating-row">
            <span class="rating-value" id="modalRating"></span>
            <span><span class="stars" aria-hidden="true">★★★★★</span><small id="ratingLabel">Reader rating</small></span>
          </div>
        </div>
      </article>
    </div>

    <script src="app.js"></script>
  </body>
</html>
