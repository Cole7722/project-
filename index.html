<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171714" />
    <title>Northwood Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Northwood Library home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span></span>
        <span>Northwood<br /><strong>Library</strong></span>
      </a>
      <nav aria-label="Primary navigation">
        <a class="nav-link active" href="#catalogue">Catalogue</a>
        <a class="nav-link" href="#loans">My Loans <span id="loanCount">0</span></a>
      </nav>
    </header>

    <main>
      <section class="hero" id="catalogue">
        <p class="eyebrow">Explore the collection</p>
        <h1>Find your next<br />great read.</h1>

        <div class="search-wrap">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
          <label class="sr-only" for="searchInput">Search by title or author</label>
          <input id="searchInput" type="search" placeholder="Search by title or author..." autocomplete="off" />
          <span id="resultCount" aria-live="polite">0 books</span>
        </div>
      </section>

      <section class="catalogue" aria-labelledby="catalogueTitle">
        <div class="toolbar">
          <h2 id="catalogueTitle">All books</h2>
          <div class="filters" aria-label="Filter books">
            <button class="filter active" type="button" data-filter="all">All</button>
            <button class="filter" type="button" data-filter="available">Available</button>
            <button class="filter" type="button" data-filter="loan">On loan</button>
          </div>
        </div>
        <div id="bookGrid" class="book-grid"></div>
        <div id="emptyState" class="empty-state" hidden>
          <h3>No books found</h3>
          <p>Try another title or author.</p>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
